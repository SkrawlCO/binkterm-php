[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/var/www/html/data/logs/supervisord.log
pidfile=/var/www/html/data/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true

[program:caddy]
command=caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
autostart=true
autorestart=true

[program:admin_daemon]
command=php /var/www/html/scripts/admin_daemon.php
directory=/var/www/html
autostart=true
autorestart=true

[program:binkp_scheduler]
command=php /var/www/html/scripts/binkp_scheduler.php
directory=/var/www/html
autostart=true
autorestart=true

[program:binkp_server]
command=php /var/www/html/scripts/binkp_server.php
directory=/var/www/html
autostart=true
autorestart=true

[program:realtime_server]
command=php /var/www/html/scripts/realtime_server.php
directory=/var/www/html
autostart=true
autorestart=true

[program:dosdoor_bridge]
command=node /var/www/html/scripts/dosbox-bridge/multiplexing-server.js
directory=/var/www/html/scripts/dosbox-bridge
autostart=true
autorestart=true
; ascii-royale (Crossroads Experience #2) launcher wiring, consumed by
; native-doors/doors/ascii-royale-m3/launch-ascii-royale.sh via pty.spawn env.
; No credential here. The retired Elsewhere / World-Gateway vars that used to
; share this line were removed 2026-09-03 (archive/elsewhere-retirement-*).
environment=ASCII_ROYALE_M3_RUNTIME_ROOT="/var/lib/ascii-royale",ASCII_ROYALE_M3_CHANNEL="/var/lib/ascii-royale/run/ascii-royale-m3/endpoint-id"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:telnet]
command=php /var/www/html/telnet/telnet_daemon.php --host=0.0.0.0 --port=2323
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; SSH front door -- same BbsSession as Telnet, reached over an SSH-2 transport
; (pure-PHP, ssh/ssh_daemon.php). Runs as root, exactly like the telnet program
; above. Per-IP pre-auth connection rate limit (SSH_RATE_LIMIT_*) and a global
; live-child cap (SSH_MAX_CHILDREN) are built into the daemon. Persistent host
; key: data/ssh/ssh_host_rsa_key on the app bind mount. Published on host 2022.
; NOTE: SSH transport activation was closed/accepted as an always-on production
; feature, so it is defined here directly rather than through the optional
; ENABLE_SSH -> conf.d.available/ssh_daemon.conf template path below.
[program:ssh_daemon]
command=php /var/www/html/ssh/ssh_daemon.php --host=0.0.0.0 --port=2022 --api-base=http://localhost
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ===========================================================================
; MultiZork -- Crossroads Experience #1 backend. Loopback-only bind,
; unprivileged service account (multizork, uid 995, created in the Dockerfile).
; DURABLE STATE -- the player database, the pinned binary, and the R88 story
; artifact -- lives on the host bind mount  ./state/multizork -> /var/lib/multizork
; (docker-compose.yml). See app/docs/Crossroads/MultiZorkProduction.md and
; ops/MIGRATION.md.
; ===========================================================================
[program:multizorkd]
command=/var/lib/multizork/bin/multizorkd /var/lib/multizork/story/zork1-r88.dat --port 43023
directory=/var/lib/multizork/state
user=multizork
autostart=true
autorestart=true
stdout_logfile=/var/lib/multizork/log/multizorkd.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/lib/multizork/log/multizorkd.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

; ===========================================================================
; ascii-royale managed arena -- Crossroads Experience #2. NO durable player
; state. The pinned binary (sha256 b7d59c40..., at /var/lib/ascii-royale/<PIN>/
; ascii-royale), the privileged lifecycle wrapper, the ALSA null config, and the
; ascii-royale user (uid 994) are all baked into the image (Dockerfile +
; docker/ascii-royale/). run/, log/, home/, tmp/ are regenerated by the wrapper
; on start. The wrapper runs as root only to publish the root:root endpoint
; channel and drop privileges; `ascii-royale serve` runs as uid 994. Logs go to
; /var/lib/ascii-royale/log/ (NOT /dev/stdout) -- upstream `serve` prints the
; EndpointId to stdout. See app/docs/Crossroads/AsciiRoyaleProduction.md.
; ===========================================================================
[program:ascii-royale-arena]
command=/var/lib/ascii-royale/bin/ascii-royale-arena.sh
directory=/var/lib/ascii-royale
user=root
autostart=true
autorestart=true
startsecs=15
startretries=5
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/var/lib/ascii-royale/log/arena.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/lib/ascii-royale/log/arena.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

; ===========================================================================
; OpenGlad relay -- Crossroads Experience #3 A-leg (M4 Slice 1F-finalize).
; Self-contained multi-room rendezvous, binds 127.0.0.1:6035 ONLY (the runtime
; refuses a non-loopback host). Forwards opaque binary game frames between
; browser peers; holds no game state, no persistence, no database, no secrets
; in its log. Authorizes every /api/* call by replaying the caller's Cookie
; against the EXISTING WebDoor session authority
;   GET http://127.0.0.1/api/webdoor/session?game_id=openglad
; (200 + session_id + game.id=="openglad" == authorized; else refused -- no
; second auth system, no bypass). Runs as unprivileged www-data. The relay
; RUNTIME + build/verify pipeline are in the app repo (scripts/openglad/,
; docs/Crossroads/openglad-backend/, commit 8c81c6a8); the built play.* Web
; artifacts are bind-mounted, NOT image-layered -- rebuilt/verified by
; docs/Crossroads/openglad-backend/build/{build-webdoor.sh,verify-webdoor.sh}.
; OpenGlad stays admin-only + config/webdoors.json openglad.enabled=false until
; Slice 1G. See app/docs/Crossroads/OpenGladProduction.md.
; ===========================================================================
[program:openglad-relay]
command=/usr/bin/node /var/www/html/scripts/openglad/openglad-relay-runtime.cjs
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=10
environment=OPENGLAD_RELAY_HOST="127.0.0.1",OPENGLAD_RELAY_PORT="6035"
stdout_logfile=/var/www/html/data/logs/openglad_relay.log
stdout_logfile_maxbytes=10485760
stdout_logfile_backups=3
stderr_logfile=/var/www/html/data/logs/openglad_relay_error.log
stderr_logfile_maxbytes=10485760
stderr_logfile_backups=3

; ===========================================================================
; Doot Games (Curated Experience) -- self-hosted CLASP relay + Nuxt app.
; Both loopback-only, both run as www-data. The relay carries only ephemeral
; in-memory room state (matches canonical CLASP; no journal/persistence
; feature was built); the app carries durable state in its own local
; libSQL/SQLite file under data/doot/app/.data. See
; app/docs/Crossroads/doot-backend/README.md.
; ===========================================================================
[program:doot-clasp-relay]
command=/var/www/html/data/doot/bin/clasp-router --listen 127.0.0.1:6036 --auth-mode open --name "L33TEST Doot Relay"
directory=/var/www/html/data/doot
user=www-data
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/var/www/html/data/logs/doot_relay.log
stdout_logfile_maxbytes=10485760
stdout_logfile_backups=3
stderr_logfile=/var/www/html/data/logs/doot_relay_error.log
stderr_logfile_maxbytes=10485760
stderr_logfile_backups=3

[program:doot-app]
command=/bin/sh /var/www/html/data/doot/app/run.sh
directory=/var/www/html/data/doot/app
user=www-data
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=10
environment=NODE_ENV="production"
stdout_logfile=/var/www/html/data/logs/doot_app.log
stdout_logfile_maxbytes=10485760
stdout_logfile_backups=3
stderr_logfile=/var/www/html/data/logs/doot_app_error.log
stderr_logfile_maxbytes=10485760
stderr_logfile_backups=3

; ===========================================================================
; Tournament Trivia -- Crossroads Experience #5 shared game server (M2).
; One trivsrv process; each caller's triv32
; (app/native-doors/doors/tournament-trivia/) connects to it over POSIX
; message queues. NO durable state in M2 -- binaries + question bank + help
; text are image-baked; player.dat / settings.dat / trivsrv.lock regenerate on
; start. The wrapper just sets umask 000 (so the source's mq_open(...,0666)
; goes through for cross-account IPC) and exec's trivsrv, which self-heals its
; own stale /trvinput; clients self-heal their /trvout<N>. trivsrv setsid()s
; itself; `exec` keeps the wrapper PID so supervisord still tracks and reaps
; it. Host/container mqueue limits already suffice (no sysctl).
; See ops/docker/tournament-trivia/README.md.
; ===========================================================================
[program:tournament-trivia-srv]
command=/var/lib/tournament-trivia/bin/tournament-trivia-srv.sh
directory=/var/lib/tournament-trivia
user=tournament-trivia
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/var/lib/tournament-trivia/trivsrv.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/lib/tournament-trivia/trivsrv.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

; cron runs the scheduled maintenance jobs (rss_poster, echomail_robots,
; logrotate) via /etc/cron.d/binkterm, which entrypoint.sh regenerates on every
; container start from RSS_POSTER_*/ECHOMAIL_ROBOTS_*/LOGROTATE_* env vars.
; Must run as root: cron needs root to read /etc/cron.d, and it drops to the
; user named in each crontab line (binkterm) to actually run the jobs.
; KNOWN LIVE GAP (found during PEH-1, 2026-09-12): the current running
; binkterm-app container has NO cron program active (absent from
; `supervisorctl status`) -- it was dropped from the live-patched conf that
; added the Doot/ascii-royale/etc. blocks above. Scheduled rss_poster /
; echomail_robots / logrotate jobs are therefore not currently executing in
; production. This entry is kept/restored here because nothing indicates the
; removal was intentional; re-activating it live is a runtime change outside
; this reconciliation slice and is called out separately for follow-up.
[program:cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
stdout_logfile=/var/www/html/data/logs/cron.log
stdout_logfile_maxbytes=10485760
stderr_logfile=/var/www/html/data/logs/cron_error.log
stderr_logfile_maxbytes=10485760
user=root

; Optional daemons (Gemini, FTP, MRC, AI bot, Matterbridge, MCP server) are
; not defined here. Each ships as a template in docker/conf.d.available/ and is
; only activated -- by entrypoint.sh copying its .conf into
; /etc/supervisor/conf.d/enabled/ -- when its ENABLE_* environment variable is
; set to true. See docs/DOCKER.md.
; KNOWN LIVE GAP (found during PEH-1, 2026-09-12): this [include] directive was
; also missing from the live-patched conf described above, which would have
; silently prevented any of these optional daemons from activating even with
; their ENABLE_* var set. Restored here; not yet re-verified live.
[include]
files = /etc/supervisor/conf.d/enabled/*.conf
