_tileWrap" role="listitem"><button type="button" class="howto-module__wZhHna__trigger howto-module__wZhHna__chip games-module__ailQQq__tileHelp" data-testid="how-to-play-blitz" aria-label="How to play Blitz"><span aria-hidden="true">?</span></button><button type="button" aria-disabled="false" data-shelved="false" data-testid="game-blitz" class="modes-module__Q2onqW__tile games-module__ailQQq__tile" style="--tile-accent:#e29349;--tile-accent-soft:#e2934944;--tile-shade:#96471c"><div class="games-module__ailQQq__tileArt"><span class="modes-module__Q2onqW__preview" aria-hidden="true"><span class="games-module__ailQQq__fanCard">A♠</span><span class="games-module__ailQQq__fanCard">31</span><span class="games-module__ailQQq__fanCard">K♠</span></span></div><span class="modes-module__Q2onqW__tagline games-module__ailQQq__tileTagline">Chase thirty-one</span><h2 class="modes-module__Q2onqW__modeName games-module__ailQQq__tileTitle">Blitz<!-- --> <span class="games-module__ailQQq__tileSubtitle">the 31 game</span></h2><span class="modes-module__Q2onqW__facts games-module__ailQQq__tileFacts"><span class="modes-module__Q2onqW__fact">2–4 players</span><span class="modes-module__Q2onqW__fact">classic · fast · timed</span><span class="modes-module__Q2onqW__fact">solo or friends</span></span><p class="modes-module__Q2onqW__description games-module__ailQQq__tileDescription">Draw, swap, and knock your way to 31 in one suit. Three match formats, sly bots, and one very loud celebration.</p></button></div><div class="games-module__ailQQq__tileWrap" role="listitem"><button type="button" class="howto-module__wZhHna__trigger howto-module__wZhHna__chip games-module__ailQQq__tileHelp" data-testid="how-to-play-cribbage" aria-label="How to play Cribbage"><span aria-hidden="true">?</span></button><button type="button" aria-disabled="false" data-shelved="false" data-testid="game-cribbage" class="modes-module__Q2onqW__tile games-module__ailQQq__tile" style="--tile-accent:#7d5ba6;--tile-accent-soft:#7d5ba644;--tile-shade:#463061"><div class="games-module__ailQQq__tileArt"><span class="modes-module__Q2onqW__preview" aria-hidden="true"><span class="games-module__ailQQq__fanCard">J♠</span><span class="games-module__ailQQq__fanCard">15</span><span class="games-module__ailQQq__wildCard" style="--art-from:#8a6cc0;--art-to:#4c3172">5♦</span><span class="games-module__ailQQq__fanCard">121</span></span></div><span class="modes-module__Q2onqW__tagline games-module__ailQQq__tileTagline">Peg home to 121</span><h2 class="modes-module__Q2onqW__modeName games-module__ailQQq__tileTitle">Cribbage<!-- --> <span class="games-module__ailQQq__tileSubtitle">the pegging race</span></h2><span class="modes-module__Q2onqW__facts games-module__ailQQq__tileFacts"><span class="modes-module__Q2onqW__fact">2 players</span><span class="modes-module__Q2onqW__fact">classic · cutthroat</span><span class="modes-module__Q2onqW__fact">solo or friends</span></span><p class="modes-module__Q2onqW__description games-module__ailQQq__tileDescription">The classic pub race — build fifteens, runs and pairs in your hand, peg them home on the board, and pray nobody cuts a jack behind you.</p></button></div><div class="games-module__ailQQq__tileWrap" role="listitem"><button type="button" class="howto-module__wZhHna__trigger howto-module__wZhHna__chip games-module__ailQQq__tileHelp" data-testid="how-to-play-wild" aria-label="How to play Wild"><span aria-hidden="true">?</span></button><button type="button" aria-disabled="false" data-shelved="false" data-testid="game-wild" class="modes-module__Q2onqW__tile games-module__ailQQq__tile" style="--tile-accent:#c8566b;--tile-accent-soft:#c8566b44;--tile-shade:#7c2c3e"><div class="games-module__ailQQq__tileArt"><span class="modes-module__Q2onqW__preview" aria-hidden="true"><span class="games-module__ailQQq__wildCard" style="--art-from:#d95763;--art-to:#a3372c">7</span><span class="games-module__ailQQq__wildCard" style="--art-from:#e2b049;--art-to:#b07a1c">⤺</span><span class="games-module__ailQQq__wildCard" style="--art-from:#5fae7b;--art-to:#2f6b48">⊘</span><span class="games-module__ailQQq__wildCard" style="--art-from:#4ba1ba;--art-to:#25586e">+4</span></span></div><span class="modes-module__Q2onqW__tagline games-module__ailQQq__tileTagline">Shed every card</span><h2 class="modes-module__Q2onqW__modeName games-module__ailQQq__tileTitle">Wild<!-- --> <span class="games-module__ailQQq__tileSubtitle">the shedding game</span></h2><span class="modes-module__Q2onqW__facts games-module__ailQQq__tileFacts"><span class="modes-module__Q2onqW__fact">2–4 players</span><span class="modes-module__Q2onqW__fact">timed deal</span><span class="modes-module__Q2onqW__fact">solo or friends</span></span><p class="modes-module__Q2onqW__description games-module__ailQQq__tileDescription">A 112-card riot of skips, reverses, draw-fours, color dumps and jump-ins. Same warm table, a much louder deck.</p></button></div><div class="games-module__ailQQq__tileWrap" role="listitem"><button type="button" class="howto-module__wZhHna__trigger howto-module__wZhHna__chip games-module__ailQQq__tileHelp" data-testid="how-to-play-crazy-eights" aria-label="How to play Crazy Eights"><span aria-hidden="true">?</span></button><button type="button" aria-disabled="false" data-shelved="false" data-testid="game-eights" class="modes-module__Q2onqW__tile games-module__ailQQq__tile" style="--tile-accent:#3f8f96;--tile-accent-soft:#3f8f9644;--tile-shade:#1f4a52"><div class="games-module__ailQQq__tileArt"><span class="modes-module__Q2onqW__preview" aria-hidden="true"><span class="games-module__ailQQq__wildCard" style="--art-from:#4ba1ba;--art-to:#25586e">8♦</span><span class="games-module__ailQQq__wildCard" style="--art-from:#3d4a6b;--art-to:#1d2438">Q♠</span><span class="games-module__ailQQq__wildCard" style="--art-from:#c8566b;--art-to:#7c2c3e">2♥</span><span class="games-module__ailQQq__wildCard" style="--art-from:#5fae7b;--art-to:#2f6b48">A♣</span></span></div><span class="modes-module__Q2onqW__tagline games-module__ailQQq__tileTagline">Eights go anywhere</span><h2 class="modes-module__Q2onqW__modeName games-module__ailQQq__tileTitle">Crazy Eights<!-- --> <span class="games-module__ailQQq__tileSubtitle">the wild-card shedder</span></h2><span class="modes-module__Q2onqW__facts games-module__ailQQq__tileFacts"><span class="modes-module__Q2onqW__fact">2–6 players</span><span class="modes-module__Q2onqW__fact">play to a score</span><span class="modes-module__Q2onqW__fact">solo or friends</span></span><p class="modes-module__Q2onqW__description games-module__ailQQq__tileDescription">One ordinary pack, one growing pile. Follow the suit or the rank, drop an eight to bend the table to a suit of your choosing, and charge everyone else for whatever they are still holding.</p></button></div><div class="games-module__ailQQq__tileWrap" role="listitem"><button type="button" class="howto-module__wZhHna__trigger howto-module__wZhHna__chip games-module__ailQQq__tileHelp" data-testid="how-to-play-rat-screw" aria-label="How to play Rat Screw"><span aria-hidden="true">?</span></button><button type="button" aria-disabled="false" data-shelved="false" data-testid="game-ratscrew" class="modes-module__Q2onqW__tile games-module__ailQQq__tile" style="--tile-accent:#8f5fb5;--tile-accent-soft:#8f5fb544;--tile-shade:#4a2a68"><div class="games-module__ailQQq__tileArt"><span class="modes-module__Q2onqW__preview" aria-hidden="true"><span class="games-module__ailQQq__wildCard" style="--art-from:#8f5fb5;--art-to:#4a2a68">7♦</span><span class="games-module__ailQQq__wildCard" style="--art-from:#b8593f;--art-to:#6e2a1a">7♣</span><span class="games-module__ailQQq__wildCard" style="--art-from:#d98e3c;--art-to:#7c4a17">SLAP!</span><span class="games-module__ailQQq__wildCard" style="--art-from:#4ba1ba;--art-to:#25586e">K♠</span></span></div><span class="modes-module__Q2onqW__tagline games-module__ailQQq__tileTagline">Slap the pile first</span><h2 class="modes-module__Q2onqW__modeName games-module__ailQQq__tileTitle">Rat Screw<!-- --> <span class="games-module__ailQQq__tileSubtitle">the slap game</span></h2><span class="modes-module__Q2onqW__facts games-module__ailQQq__tileFacts"><span class="modes-module__Q2onqW__fact">2–4 players</span><span class="modes-module__Q2onqW__fact">real-time slaps</span><span class="modes-module__Q2onqW__fact">solo or friends</span></span><p class="modes-module__Q2onqW__description games-module__ailQQq__tileDescription">Flip onto a shared pile and slap doubles, sandwiches and more before anyone else. Real-time reflexes, face-card challenges, mis-slap burns.</p></button></div><div class="games-module__ailQQq__tileWrap" role="listitem"><button type="button" class="howto-module__wZhHna__trigger howto-module__wZhHna__chip games-module__ailQQq__tileHelp" data-testid="how-to-play-euchre" aria-label="How to play Euchre"><span aria-hidden="true">?</span></button><button type="button" aria-disabled="false" data-shelved="false" data-testid="game-euchre" class="modes-module__Q2onqW__tile games-module__ailQQq__tile" style="--tile-accent:#5fae7b;--tile-accent-soft:#5fae7b44;--tile-shade:#2f6b48"><div class="games-module__ailQQq__tileArt"><span class="modes-module__Q2onqW__preview" aria-hidden="true"><span class="games-module__ailQQq__wildCard" style="--art-from:#d95763;--art-to:#a3372c">J♥</span><span class="games-module__ailQQq__wildCard" style="--art-from:#e2b049;--art-to:#b07a1c">J♦</span><span class="games-module__ailQQq__fanCard">A♠</span></span></div><span class="modes-module__Q2onqW__tagline games-module__ailQQq__tileTagline">Take tricks for your team</span><h2 class="modes-module__Q2onqW__modeName games-module__ailQQq__tileTitle">Euchre<!-- --> <span class="games-module__ailQQq__tileSubtitle">the partner game</span></h2><span class="modes-module__Q2onqW__facts games-module__ailQQq__tileFacts"><span class="modes-module__Q2onqW__fact">4 players · 2v2</span><span class="modes-module__Q2onqW__fact">trick-taking</span><span class="modes-module__Q2onqW__fact">solo or friends</span></span><p class="modes-module__Q2onqW__description games-module__ailQQq__tileDescription">Order it up, name your trump, and chase bowers with the player across the table. First team to ten takes the match.</p></button></div><div class="games-module__ailQQq__tileWrap" role="listitem"><button type="button" class="howto-module__wZhHna__trigger howto-module__wZhHna__chip games-module__ailQQq__tileHelp" data-testid="how-to-play-spades" aria-label="How to play Spades"><span aria-hidden="true">?</span></button><button type="button" aria-disabled="false" data-shelved="false" data-testid="game-spades" class="modes-module__Q2onqW__tile games-module__ailQQq__tile" style="--tile-accent:#3d4a6b;--tile-accent-soft:#3d4a6b44;--tile-shade:#1c2438"><div class="games-module__ailQQq__tileArt"><span class="modes-module__Q2onqW__preview" aria-hidden="true"><span class="games-module__ailQQq__wildCard" style="--art-from:#4a4a55;--art-to:#1d1d26">A♠</span><span class="games-module__ailQQq__wildCard" style="--art-from:#3d4a6b;--art-to:#1c2438">K♠</span><span class="games-module__ailQQq__fanCard">Q♠</span><span class="games-module__ailQQq__wildCard" style="--art-from:#e2b049;--art-to:#8a6a1c">J♠</span></span></div><span class="modes-module__Q2onqW__tagline games-module__ailQQq__tileTagline">Bid your books</span><h2 class="modes-module__Q2onqW__modeName games-module__ailQQq__tileTitle">Spades<!-- --> <span class="games-module__ailQQq__tileSubtitle">the partner game</span></h2><span class="modes-module__Q2onqW__facts games-module__ailQQq__tileFacts"><span class="modes-module__Q2onqW__fact">4 players · 2v2</span><span class="modes-module__Q2onqW__fact">bid · trump · bags</span><span class="modes-module__Q2onqW__fact">solo or friends</span></span><p class="modes-module__Q2onqW__description games-module__ailQQq__tileDescription">Sit across from your partner, name a number, and take that many tricks — no more, no fewer if you can help it. Spades are always trump. Bags will find you.</p></button></div><div class="games-module__ailQQq__tileWrap" role="listitem"><button type="button" class="howto-module__wZhHna__trigger howto-module__wZhHna__chip games-module__ailQQq__tileHelp" data-testid="how-to-play-poker" aria-label="How to play Poker"><span aria-hidden="true">?</span></button><button type="button" aria-disabled="false" data-shelved="false" data-testid="game-poker" class="modes-module__Q2onqW__tile games-module__ailQQq__tile" style="--tile-accent:#2f6b48;--tile-accent-soft:#2f6b4844;--tile-shade:#17351f"><div class="games-module__ailQQq__tileArt"><span class="modes-module__Q2onqW__preview" aria-hidden="true"><span class="games-module__ailQQq__wildCard" style="--art-from:#4a4a55;--art-to:#1d1d26">A♠</span><span class="games-module__ailQQq__wildCard" style="--art-from:#c2593f;--art-to:#7a2f1f">A♥</span><span class="games-module__ailQQq__fanCard">K♦</span><span class="games-module__ailQQq__wildCard" style="--art-from:#5fae7b;--art-to:#2f6b48">Q♣</span></span></div><span class="modes-module__Q2onqW__tagline games-module__ailQQq__tileTagline">Last stack standing</span><h2 class="modes-module__Q2onqW__modeName games-module__ailQQq__tileTitle">Poker<!-- --> <span class="games-module__ailQQq__tileSubtitle">no-limit hold’em</span></h2><span class="modes-module__Q2onqW__facts games-module__ailQQq__tileFacts"><span class="modes-module__Q2onqW__fact">2–6 players</span><span class="modes-module__Q2onqW__fact">no-limit hold’em</span><span class="modes-module__Q2onqW__fact">play chips only</span></span><p class="modes-module__Q2onqW__description games-module__ailQQq__tileDescription">Two cards of your own, five in the middle, and every chip you have to say how much you believe them. The blinds climb until somebody has all of it.</p></button></div><div class="games-module__ailQQq__tileWrap" role="listitem"><button type="button" class="howto-module__wZhHna__trigger howto-module__wZhHna__chip games-module__ailQQq__t
