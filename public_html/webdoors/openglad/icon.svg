<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="OpenGlad">
  <title>OpenGlad</title>
  <!--
    Crossroads Experience #3 icon. Original L33TEST artwork, hand-authored
    vector; no third-party or upstream OpenGlad assets are used. Motif: a
    gladius (secutor) crossed with a trident (retiarius) over an arena oval,
    the classic gladiator pairing, with the two weapons meeting standing for
    the HOST and JOIN two-player match model. Palette echoes OpenGlad's own
    Web shell (parchment, gold, arena green on near-black) in the flat
    dark-rounded-panel style shared with the MultiZork and ascii-royale cards.
  -->
  <defs>
    <clipPath id="og-panel">
      <rect x="16" y="16" width="480" height="480" rx="104" ry="104"/>
    </clipPath>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="104" ry="104" fill="#14181f"/>

  <g clip-path="url(#og-panel)">
    <rect x="16" y="16" width="480" height="232" fill="#191f29"/>
    <ellipse cx="256" cy="304" rx="188" ry="100" fill="none" stroke="#374330" stroke-width="16"/>
    <ellipse cx="256" cy="304" rx="150" ry="76" fill="none" stroke="#2a3325" stroke-width="8"/>
  </g>

  <g stroke-linecap="round" stroke-linejoin="round">

    <!-- gladius: hilt low-left, tip high-right -->
    <g transform="rotate(40 256 262)">
      <path d="M256 84 L240 150 L240 300 L272 300 L272 150 Z" fill="#ece1c6"/>
      <path d="M256 84 L256 300 L272 300 L272 150 Z" fill="#c8bc96"/>
      <rect x="210" y="300" width="92" height="22" rx="7" fill="#ffcf5c"/>
      <rect x="242" y="322" width="28" height="70" rx="12" fill="#7c5c36"/>
      <circle cx="256" cy="404" r="19" fill="#ffcf5c"/>
    </g>

    <!-- trident: butt low-right, tines high-left -->
    <g transform="rotate(-40 256 262)">
      <rect x="246" y="150" width="20" height="256" rx="10" fill="#c39a63"/>
      <rect x="246" y="150" width="10" height="256" rx="10" fill="#a67f4a"/>
      <rect x="190" y="138" width="132" height="20" rx="10" fill="#dcc78d"/>
      <path d="M202 150 L202 82 Q202 62 216 62 Q230 62 230 82 L230 150 Z" fill="#dcc78d"/>
      <path d="M243 150 L243 54 Q243 34 256 34 Q269 34 269 54 L269 150 Z" fill="#ece1c6"/>
      <path d="M284 150 L284 82 Q284 62 298 62 Q312 62 312 82 L312 150 Z" fill="#dcc78d"/>
      <circle cx="256" cy="412" r="17" fill="#dcc78d"/>
    </g>
  </g>
</svg>
