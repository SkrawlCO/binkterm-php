<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Chessmata">
  <title>Chessmata</title>
  <!--
    Crossroads Experience #4 icon. Original L33TEST artwork, hand-plotted
    vector geometry; no upstream Chessmata logo or any third-party asset is
    used. Motif: a bold chess knight over two crossing roads with network
    nodes. The knight stands for chess; the crossing paths and nodes stand
    for one shared board reached from many places (Web and terminal). Flat
    dark rounded-panel style and the parchment / gold on near-black palette
    shared with the MultiZork, ASCII-ROYALE and OpenGlad Curated cards.
    icon.png is rendered from this source at 512x512.
  -->
  <defs><clipPath id="cm-panel"><rect x="16" y="16" width="480" height="480" rx="104" ry="104"/></clipPath></defs>
  <rect x="16" y="16" width="480" height="480" rx="104" ry="104" fill="#14181f"/>
  <g clip-path="url(#cm-panel)" stroke-linecap="round">
    <path d="M44 44 L468 468" stroke="#1f2a35" stroke-width="60"/>
